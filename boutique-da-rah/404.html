<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Boutique da Rah</title>
<meta name="description" content="Essa página não existe. Volte para o site da Boutique da Rah e confira as peças disponíveis em Botucatu-SP.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .error-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    background:
      radial-gradient(60% 55% at 82% 12%, rgba(185, 138, 62, 0.16), transparent 70%),
      radial-gradient(50% 50% at 10% 90%, rgba(85, 35, 47, 0.14), transparent 70%),
      var(--sand-50);
  }
  .error-code {
    font-family: "Fraunces", serif;
    font-size: clamp(64px, 14vw, 120px);
    color: var(--wine-900);
    line-height: 1;
  }
  .error-page h1 {
    margin-top: 8px;
    font-size: clamp(22px, 3vw, 30px);
  }
  .error-page p {
    margin-top: 14px;
    color: rgba(36, 19, 24, 0.7);
    max-width: 46ch;
  }
  .error-actions {
    margin-top: 30px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
  <div class="error-page">
    <div>
      <p class="error-code">404</p>
      <h1>Essa peça não está aqui.</h1>
      <p>A página que você procurava não existe ou foi movida. Volte para a vitrine
      da Boutique da Rah e encontre a peça certa pra sua ocasião.</p>
      <div class="error-actions">
        <a class="btn btn-primary" href="index.html">Voltar ao site</a>
        <a class="btn btn-ghost" id="err-whats" href="#" target="_blank" rel="noopener">Falar no WhatsApp</a>
      </div>
    </div>
  </div>
  <script>
    document.getElementById("err-whats").setAttribute(
      "href",
      "https://wa.me/5511971172817?text=" +
        encodeURIComponent("Olá! Cheguei numa página que não existia no site da Boutique da Rah e queria ajuda.")
    );
  </script>
</body>
</html>
